<!DOCTYPE html>
<!-- Vista Thymeleaf: las rutas y los datos se resuelven en el controlador antes de mostrar el HTML. -->
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Registrar · Tipo Servicio | EmpleApp</title><link rel="stylesheet" th:href="@{/css/empleapp.css}"></head>
<body><header><a th:href="@{/}">EmpleApp</a><span>Gestión de tipo servicio</span></header><main>
<!-- Navegación entre las operaciones de la entidad. El enlace EmpleApp vuelve al inicio. -->
<nav aria-label="Operaciones"><a th:href="@{/tipo-servicio/registrar}">Registrar</a>
<a th:href="@{/tipo-servicio/actualizar}">Actualizar</a>
<a th:href="@{/tipo-servicio/consultar}">Consultar todos</a>
<a th:href="@{/tipo-servicio/consultar-id}">Consultar por ID</a>
<a th:href="@{/tipo-servicio/eliminar}">Eliminar</a></nav>
<h1>Registrar · Tipo Servicio</h1>
<p class="mensaje" role="status" th:if="${mensaje}" th:text="${mensaje}"></p><p class="error" role="alert" th:if="${error}" th:text="${error}"></p>
<!-- POST envía el formulario al método correspondiente del controlador. -->
<form method="post" enctype="multipart/form-data" th:action="@{/tipo-servicio/registrar}" th:object="${registro}">
<!-- Los errores de BindingResult se muestran junto al formulario. -->
<div class="error" role="alert" th:if="${#fields.hasAnyErrors()}"><p>Revisa los datos del formulario.</p><ul><li th:each="e : ${#fields.allErrors()}" th:text="${e}"></li></ul></div>
<div class="campo"><label for="nombreTipo">Nombre Tipo *</label>
<input id="nombreTipo" type="text" th:field="*{nombreTipo}" required maxlength="100">
<small class="error" th:if="${#fields.hasErrors('nombreTipo')}" th:errors="*{nombreTipo}"></small></div>
<div class="campo"><label for="descripcion">Descripcion</label>
<textarea id="descripcion" th:field="*{descripcion}" rows="4"></textarea>
<small class="error" th:if="${#fields.hasErrors('descripcion')}" th:errors="*{descripcion}"></small></div>
<div class="acciones"><button type="submit">Registrar</button><a th:href="@{/tipo-servicio/consultar}">Cancelar</a></div></form>
</main></body></html>
