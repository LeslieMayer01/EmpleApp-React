<!DOCTYPE html>
<!-- Vista Thymeleaf: las rutas y los datos se resuelven en el controlador antes de mostrar el HTML. -->
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Detalle · Contratacion | EmpleApp</title><link rel="stylesheet" th:href="@{/css/empleapp.css}"></head>
<body><header><a th:href="@{/}">EmpleApp</a><span>Gestión de contratacion</span></header><main>
<!-- Navegación entre las operaciones de la entidad. El enlace EmpleApp vuelve al inicio. -->
<nav aria-label="Operaciones"><a th:href="@{/contratacion/registrar}">Registrar</a>
<a th:href="@{/contratacion/actualizar}">Actualizar</a>
<a th:href="@{/contratacion/consultar}">Consultar todos</a>
<a th:href="@{/contratacion/consultar-id}">Consultar por ID</a>
<a th:href="@{/contratacion/eliminar}">Eliminar</a></nav>
<h1>Detalle · Contratacion</h1>
<p class="mensaje" role="status" th:if="${mensaje}" th:text="${mensaje}"></p><p class="error" role="alert" th:if="${error}" th:text="${error}"></p>
<section th:if="${registro}"><dl><dt>Id Contratacion</dt><dd th:text="${registro.idContratacion}"></dd>
<dt>Servicio</dt><dd th:text="${registro.servicio == null ? '—' : registro.servicio.idServicio}"></dd>
<dt>Trabajador</dt><dd th:text="${registro.trabajador == null ? '—' : registro.trabajador.idTrabajador}"></dd>
<dt>Fecha Contratacion</dt><dd th:text="${registro.fechaContratacion}"></dd></dl><div class="acciones"><a th:href="@{/contratacion/actualizar(id=${registro.idContratacion})}">Actualizar</a><a th:href="@{/contratacion/eliminar(id=${registro.idContratacion})}">Eliminar</a></div></section>
</main></body></html>
