<!DOCTYPE html>
<!-- Vista Thymeleaf: las rutas y los datos se resuelven en el controlador antes de mostrar el HTML. -->
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Detalle · Postulacion | EmpleApp</title><link rel="stylesheet" th:href="@{/css/empleapp.css}"></head>
<body><header><a th:href="@{/}">EmpleApp</a><span>Gestión de postulacion</span></header><main>
<!-- Navegación entre las operaciones de la entidad. El enlace EmpleApp vuelve al inicio. -->
<nav aria-label="Operaciones"><a th:href="@{/postulacion/registrar}">Registrar</a>
<a th:href="@{/postulacion/actualizar}">Actualizar</a>
<a th:href="@{/postulacion/consultar}">Consultar todos</a>
<a th:href="@{/postulacion/consultar-id}">Consultar por ID</a>
<a th:href="@{/postulacion/eliminar}">Eliminar</a></nav>
<h1>Detalle · Postulacion</h1>
<p class="mensaje" role="status" th:if="${mensaje}" th:text="${mensaje}"></p><p class="error" role="alert" th:if="${error}" th:text="${error}"></p>
<section th:if="${registro}"><dl><dt>Id Postulacion</dt><dd th:text="${registro.idPostulacion}"></dd>
<dt>Servicio</dt><dd th:text="${registro.servicio == null ? '—' : registro.servicio.etiqueta}"></dd>
<dt>Trabajador</dt><dd th:text="${registro.trabajador == null ? '—' : registro.trabajador.etiqueta}"></dd>
<dt>Fecha Postulacion</dt><dd th:text="${registro.fechaPostulacion}"></dd></dl><div class="acciones"><a th:href="@{/postulacion/actualizar(id=${registro.idPostulacion})}">Actualizar</a><a th:href="@{/postulacion/eliminar(id=${registro.idPostulacion})}">Eliminar</a></div></section>
</main></body></html>
