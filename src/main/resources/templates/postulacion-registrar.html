<!DOCTYPE html>
<!-- Vista Thymeleaf: las rutas y los datos se resuelven en el controlador antes de mostrar el HTML. -->
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Registrar · Postulacion | EmpleApp</title><link rel="stylesheet" th:href="@{/css/empleapp.css}"></head>
<body><header><a th:href="@{/}">EmpleApp</a><span>Gestión de postulacion</span></header><main>
<!-- Navegación entre las operaciones de la entidad. El enlace EmpleApp vuelve al inicio. -->
<nav aria-label="Operaciones"><a th:href="@{/postulacion/registrar}">Registrar</a>
<a th:href="@{/postulacion/actualizar}">Actualizar</a>
<a th:href="@{/postulacion/consultar}">Consultar todos</a>
<a th:href="@{/postulacion/consultar-id}">Consultar por ID</a>
<a th:href="@{/postulacion/eliminar}">Eliminar</a></nav>
<h1>Registrar · Postulacion</h1>
<p class="mensaje" role="status" th:if="${mensaje}" th:text="${mensaje}"></p><p class="error" role="alert" th:if="${error}" th:text="${error}"></p>
<!-- POST envía el formulario al método correspondiente del controlador. -->
<form method="post" enctype="multipart/form-data" th:action="@{/postulacion/registrar}" th:object="${registro}">
<!-- Los errores de BindingResult se muestran junto al formulario. -->
<div class="error" role="alert" th:if="${#fields.hasAnyErrors()}"><p>Revisa los datos del formulario.</p><ul><li th:each="e : ${#fields.allErrors()}" th:text="${e}"></li></ul></div>
<div class="campo"><label for="servicio">Servicio *</label>
<!-- Las opciones corresponden a registros existentes de la entidad relacionada. -->
<select id="servicio" th:field="*{servicio.idServicio}" required><option value="">Selecciona una opción</option><option th:each="opcion : ${opcionesServicio}" th:value="${opcion.idServicio}" th:text="${opcion.etiqueta}"></option></select>
<small class="error" th:if="${#fields.hasErrors('servicio')}" th:errors="*{servicio}"></small></div>
<div class="campo"><label for="trabajador">Trabajador *</label>
<!-- Las opciones corresponden a registros existentes de la entidad relacionada. -->
<select id="trabajador" th:field="*{trabajador.idTrabajador}" required><option value="">Selecciona una opción</option><option th:each="opcion : ${opcionesTrabajador}" th:value="${opcion.idTrabajador}" th:text="${opcion.etiqueta}"></option></select>
<small class="error" th:if="${#fields.hasErrors('trabajador')}" th:errors="*{trabajador}"></small></div>
<div class="campo"><label for="fechaPostulacion">Fecha Postulacion</label>
<input id="fechaPostulacion" type="datetime-local" th:field="*{fechaPostulacion}" step="any">
<small class="error" th:if="${#fields.hasErrors('fechaPostulacion')}" th:errors="*{fechaPostulacion}"></small></div>
<div class="acciones"><button type="submit">Registrar</button><a th:href="@{/postulacion/consultar}">Cancelar</a></div></form>
</main></body></html>
