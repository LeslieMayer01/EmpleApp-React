<!DOCTYPE html>
<!-- Vista Thymeleaf: las rutas y los datos se resuelven en el controlador antes de mostrar el HTML. -->
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Actualizar · Rol | EmpleApp</title><link rel="stylesheet" th:href="@{/css/empleapp.css}"></head>
<body><header><a th:href="@{/}">EmpleApp</a><span>Gestión de rol</span></header><main>
<!-- Navegación entre las operaciones de la entidad. El enlace EmpleApp vuelve al inicio. -->
<nav aria-label="Operaciones"><a th:href="@{/rol/registrar}">Registrar</a>
<a th:href="@{/rol/actualizar}">Actualizar</a>
<a th:href="@{/rol/consultar}">Consultar todos</a>
<a th:href="@{/rol/consultar-id}">Consultar por ID</a>
<a th:href="@{/rol/eliminar}">Eliminar</a></nav>
<h1>Actualizar · Rol</h1>
<p class="mensaje" role="status" th:if="${mensaje}" th:text="${mensaje}"></p><p class="error" role="alert" th:if="${error}" th:text="${error}"></p>
<!-- GET consulta o carga un registro sin modificar la base de datos. -->
<form method="get" th:action="@{/rol/actualizar}" class="busqueda"><label for="id">ID del registro</label><input id="id" name="id" type="number" min="1" required><button type="submit">Cargar registro</button></form><!-- POST envía el formulario al método correspondiente del controlador. -->
<form method="post" enctype="multipart/form-data" th:action="@{/rol/actualizar}" th:object="${registro}" th:if="${registro}">
<!-- Los errores de BindingResult se muestran junto al formulario. -->
<div class="error" role="alert" th:if="${#fields.hasAnyErrors()}"><p>Revisa los datos del formulario.</p><ul><li th:each="e : ${#fields.allErrors()}" th:text="${e}"></li></ul></div>
<input type="hidden" th:field="*{idRol}">
<div class="campo"><label for="nombreRol">Nombre Rol *</label>
<input id="nombreRol" type="text" th:field="*{nombreRol}" required maxlength="50">
<small class="error" th:if="${#fields.hasErrors('nombreRol')}" th:errors="*{nombreRol}"></small></div>
<div class="acciones"><button type="submit">Guardar cambios</button><a th:href="@{/rol/consultar}">Cancelar</a></div></form>
</main></body></html>
