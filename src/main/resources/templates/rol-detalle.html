<!DOCTYPE html>
<!-- Vista Thymeleaf: las rutas y los datos se resuelven en el controlador antes de mostrar el HTML. -->
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Detalle · Rol | EmpleApp</title><link rel="stylesheet" th:href="@{/css/empleapp.css}"></head>
<body><header><a th:href="@{/}">EmpleApp</a><span>Gestión de rol</span></header><main>
<!-- Navegación entre las operaciones de la entidad. El enlace EmpleApp vuelve al inicio. -->
<nav aria-label="Operaciones"><a th:href="@{/rol/registrar}">Registrar</a>
<a th:href="@{/rol/actualizar}">Actualizar</a>
<a th:href="@{/rol/consultar}">Consultar todos</a>
<a th:href="@{/rol/consultar-id}">Consultar por ID</a>
<a th:href="@{/rol/eliminar}">Eliminar</a></nav>
<h1>Detalle · Rol</h1>
<p class="mensaje" role="status" th:if="${mensaje}" th:text="${mensaje}"></p><p class="error" role="alert" th:if="${error}" th:text="${error}"></p>
<section th:if="${registro}"><dl><dt>Id Rol</dt><dd th:text="${registro.idRol}"></dd>
<dt>Nombre Rol</dt><dd th:text="${registro.nombreRol}"></dd></dl><div class="acciones"><a th:href="@{/rol/actualizar(id=${registro.idRol})}">Actualizar</a><a th:href="@{/rol/eliminar(id=${registro.idRol})}">Eliminar</a></div></section>
</main></body></html>
