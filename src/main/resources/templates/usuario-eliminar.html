<!DOCTYPE html>
<!-- Vista Thymeleaf: las rutas y los datos se resuelven en el controlador antes de mostrar el HTML. -->
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Eliminar · Usuario | EmpleApp</title><link rel="stylesheet" th:href="@{/css/empleapp.css}"></head>
<body><header><a th:href="@{/}">EmpleApp</a><span>Gestión de usuario</span></header><main>
<!-- Navegación entre las operaciones de la entidad. El enlace EmpleApp vuelve al inicio. -->
<nav aria-label="Operaciones"><a th:href="@{/usuario/registrar}">Registrar</a>
<a th:href="@{/usuario/actualizar}">Actualizar</a>
<a th:href="@{/usuario/consultar}">Consultar todos</a>
<a th:href="@{/usuario/consultar-id}">Consultar por ID</a>
<a th:href="@{/usuario/eliminar}">Eliminar</a></nav>
<h1>Eliminar · Usuario</h1>
<p class="mensaje" role="status" th:if="${mensaje}" th:text="${mensaje}"></p><p class="error" role="alert" th:if="${error}" th:text="${error}"></p>
<!-- GET consulta o carga un registro sin modificar la base de datos. -->
<form method="get" th:action="@{/usuario/eliminar}" class="busqueda"><label for="id">ID del registro</label><input id="id" name="id" type="number" min="1" required><button type="submit">Cargar registro</button></form><section th:if="${registro}"><dl><dt>Id Usuario</dt><dd th:text="${registro.idUsuario}"></dd>
<dt>Nombre</dt><dd th:text="${registro.nombre}"></dd>
<dt>Correo</dt><dd th:text="${registro.correo}"></dd>
<dt>Rol</dt><dd th:text="${registro.rol == null ? '—' : registro.rol.etiqueta}"></dd></dl><p>Confirma la eliminación de este registro.</p><!-- POST envía el formulario al método correspondiente del controlador. -->
<form method="post" th:action="@{/usuario/eliminar}"><input type="hidden" name="id" th:value="${registro.idUsuario}"><button class="peligro" type="submit">Confirmar eliminación</button><a th:href="@{/usuario/consultar}">Cancelar</a></form></section>
</main></body></html>
