<!DOCTYPE html>
<!-- Vista Thymeleaf: las rutas y los datos se resuelven en el controlador antes de mostrar el HTML. -->
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Consultar todos · Empleador | EmpleApp</title><link rel="stylesheet" th:href="@{/css/empleapp.css}"></head>
<body><header><a th:href="@{/}">EmpleApp</a><span>Gestión de empleador</span></header><main>
<!-- Navegación entre las operaciones de la entidad. El enlace EmpleApp vuelve al inicio. -->
<nav aria-label="Operaciones"><a th:href="@{/empleador/registrar}">Registrar</a>
<a th:href="@{/empleador/actualizar}">Actualizar</a>
<a th:href="@{/empleador/consultar}">Consultar todos</a>
<a th:href="@{/empleador/consultar-id}">Consultar por ID</a>
<a th:href="@{/empleador/eliminar}">Eliminar</a></nav>
<h1>Consultar todos · Empleador</h1>
<p class="mensaje" role="status" th:if="${mensaje}" th:text="${mensaje}"></p><p class="error" role="alert" th:if="${error}" th:text="${error}"></p>
<p th:if="${#lists.isEmpty(registros)}">No hay registros. <a th:href="@{/empleador/registrar}">Registrar el primero</a></p><div class="tabla" th:unless="${#lists.isEmpty(registros)}"><!-- th:each recorre los registros del modelo; th:text muestra sus valores como texto. -->
<table><thead><tr><th scope="col">Id Empleador</th><th scope="col">Usuario</th><th scope="col">Direccion</th><th scope="col">Telefono</th><th scope="col">Acciones</th></tr></thead><tbody><tr th:each="registro : ${registros}"><td th:text="${registro.idEmpleador}"></td><td th:text="${registro.usuario == null ? '—' : registro.usuario.idUsuario}"></td><td th:text="${registro.direccion}"></td><td th:text="${registro.telefono}"></td><td class="acciones"><a th:href="@{/empleador/detalle(id=${registro.idEmpleador})}">Detalle</a><a th:href="@{/empleador/actualizar(id=${registro.idEmpleador})}">Actualizar</a><a th:href="@{/empleador/eliminar(id=${registro.idEmpleador})}">Eliminar</a></td></tr></tbody></table></div>
</main></body></html>
