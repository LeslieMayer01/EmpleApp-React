<!DOCTYPE html>
<!-- Vista Thymeleaf: las rutas y los datos se resuelven en el controlador antes de mostrar el HTML. -->
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Detalle · Tipo Servicio | EmpleApp</title><link rel="stylesheet" th:href="@{/css/empleapp.css}"></head>
<body><header><a th:href="@{/}">EmpleApp</a><span>Gestión de tipo servicio</span></header><main>
<!-- Navegación entre las operaciones de la entidad. El enlace EmpleApp vuelve al inicio. -->
<nav aria-label="Operaciones"><a th:href="@{/tipo-servicio/registrar}">Registrar</a>
<a th:href="@{/tipo-servicio/actualizar}">Actualizar</a>
<a th:href="@{/tipo-servicio/consultar}">Consultar todos</a>
<a th:href="@{/tipo-servicio/consultar-id}">Consultar por ID</a>
<a th:href="@{/tipo-servicio/eliminar}">Eliminar</a></nav>
<h1>Detalle · Tipo Servicio</h1>
<p class="mensaje" role="status" th:if="${mensaje}" th:text="${mensaje}"></p><p class="error" role="alert" th:if="${error}" th:text="${error}"></p>
<section th:if="${registro}"><dl><dt>Id Tipo Servicio</dt><dd th:text="${registro.idTipoServicio}"></dd>
<dt>Nombre Tipo</dt><dd th:text="${registro.nombreTipo}"></dd>
<dt>Descripcion</dt><dd th:text="${registro.descripcion}"></dd></dl><div class="acciones"><a th:href="@{/tipo-servicio/actualizar(id=${registro.idTipoServicio})}">Actualizar</a><a th:href="@{/tipo-servicio/eliminar(id=${registro.idTipoServicio})}">Eliminar</a></div></section>
</main></body></html>
