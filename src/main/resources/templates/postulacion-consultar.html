<!DOCTYPE html>
<!-- Vista Thymeleaf: las rutas y los datos se resuelven en el controlador antes de mostrar el HTML. -->
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Consultar todos · Postulacion | EmpleApp</title><link rel="stylesheet" th:href="@{/css/empleapp.css}"></head>
<body><header><a th:href="@{/}">EmpleApp</a><span>Gestión de postulacion</span></header><main>
<!-- Navegación entre las operaciones de la entidad. El enlace EmpleApp vuelve al inicio. -->
<nav aria-label="Operaciones"><a th:href="@{/postulacion/registrar}">Registrar</a>
<a th:href="@{/postulacion/actualizar}">Actualizar</a>
<a th:href="@{/postulacion/consultar}">Consultar todos</a>
<a th:href="@{/postulacion/consultar-id}">Consultar por ID</a>
<a th:href="@{/postulacion/eliminar}">Eliminar</a></nav>
<h1>Consultar todos · Postulacion</h1>
<p class="mensaje" role="status" th:if="${mensaje}" th:text="${mensaje}"></p><p class="error" role="alert" th:if="${error}" th:text="${error}"></p>
<p th:if="${#lists.isEmpty(registros)}">No hay registros. <a th:href="@{/postulacion/registrar}">Registrar el primero</a></p><div class="tabla" th:unless="${#lists.isEmpty(registros)}"><!-- th:each recorre los registros del modelo; th:text muestra sus valores como texto. -->
<table><thead><tr><th scope="col">Id Postulacion</th><th scope="col">Servicio</th><th scope="col">Trabajador</th><th scope="col">Fecha Postulacion</th><th scope="col">Acciones</th></tr></thead><tbody><tr th:each="registro : ${registros}"><td th:text="${registro.idPostulacion}"></td><td th:text="${registro.servicio == null ? '—' : registro.servicio.etiqueta}"></td><td th:text="${registro.trabajador == null ? '—' : registro.trabajador.etiqueta}"></td><td th:text="${registro.fechaPostulacion}"></td><td class="acciones"><a th:href="@{/postulacion/detalle(id=${registro.idPostulacion})}">Detalle</a><a th:href="@{/postulacion/actualizar(id=${registro.idPostulacion})}">Actualizar</a><a th:href="@{/postulacion/eliminar(id=${registro.idPostulacion})}">Eliminar</a></td></tr></tbody></table></div>
</main></body></html>
