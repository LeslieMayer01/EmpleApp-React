<!DOCTYPE html>
<!-- Vista Thymeleaf: las rutas y los datos se resuelven en el controlador antes de mostrar el HTML. -->
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Consultar todos · Pago | EmpleApp</title><link rel="stylesheet" th:href="@{/css/empleapp.css}"></head>
<body><header><a th:href="@{/}">EmpleApp</a><span>Gestión de pago</span></header><main>
<!-- Navegación entre las operaciones de la entidad. El enlace EmpleApp vuelve al inicio. -->
<nav aria-label="Operaciones"><a th:href="@{/pago/registrar}">Registrar</a>
<a th:href="@{/pago/actualizar}">Actualizar</a>
<a th:href="@{/pago/consultar}">Consultar todos</a>
<a th:href="@{/pago/consultar-id}">Consultar por ID</a>
<a th:href="@{/pago/eliminar}">Eliminar</a></nav>
<h1>Consultar todos · Pago</h1>
<p class="mensaje" role="status" th:if="${mensaje}" th:text="${mensaje}"></p><p class="error" role="alert" th:if="${error}" th:text="${error}"></p>
<p th:if="${#lists.isEmpty(registros)}">No hay registros. <a th:href="@{/pago/registrar}">Registrar el primero</a></p><div class="tabla" th:unless="${#lists.isEmpty(registros)}"><!-- th:each recorre los registros del modelo; th:text muestra sus valores como texto. -->
<table><thead><tr><th scope="col">Id Pago</th><th scope="col">Contratacion</th><th scope="col">Valor Servicio</th><th scope="col">Porcentaje Comision App</th><th scope="col">Valor Comision</th><th scope="col">Valor Trabajador</th><th scope="col">Fecha Pago</th><th scope="col">Acciones</th></tr></thead><tbody><tr th:each="registro : ${registros}"><td th:text="${registro.idPago}"></td><td th:text="${registro.contratacion == null ? '—' : registro.contratacion.etiqueta}"></td><td th:text="${registro.valorServicio}"></td><td th:text="${registro.porcentajeComisionApp}"></td><td th:text="${registro.valorComision}"></td><td th:text="${registro.valorTrabajador}"></td><td th:text="${registro.fechaPago}"></td><td class="acciones"><a th:href="@{/pago/detalle(id=${registro.idPago})}">Detalle</a><a th:href="@{/pago/actualizar(id=${registro.idPago})}">Actualizar</a><a th:href="@{/pago/eliminar(id=${registro.idPago})}">Eliminar</a></td></tr></tbody></table></div>
</main></body></html>
