<!DOCTYPE html>
<!-- Vista Thymeleaf: las rutas y los datos se resuelven en el controlador antes de mostrar el HTML. -->
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Detalle · Documento Trabajador | EmpleApp</title><link rel="stylesheet" th:href="@{/css/empleapp.css}"></head>
<body><header><a th:href="@{/}">EmpleApp</a><span>Gestión de documento trabajador</span></header><main>
<!-- Navegación entre las operaciones de la entidad. El enlace EmpleApp vuelve al inicio. -->
<nav aria-label="Operaciones"><a th:href="@{/documento-trabajador/registrar}">Registrar</a>
<a th:href="@{/documento-trabajador/actualizar}">Actualizar</a>
<a th:href="@{/documento-trabajador/consultar}">Consultar todos</a>
<a th:href="@{/documento-trabajador/consultar-id}">Consultar por ID</a>
<a th:href="@{/documento-trabajador/eliminar}">Eliminar</a></nav>
<h1>Detalle · Documento Trabajador</h1>
<p class="mensaje" role="status" th:if="${mensaje}" th:text="${mensaje}"></p><p class="error" role="alert" th:if="${error}" th:text="${error}"></p>
<section th:if="${registro}"><dl><dt>Id Documento</dt><dd th:text="${registro.idDocumento}"></dd>
<dt>Trabajador</dt><dd th:text="${registro.trabajador == null ? '—' : registro.trabajador.etiqueta}"></dd>
<dt>Tipo Documento</dt><dd th:text="${registro.tipoDocumento}"></dd>
<dt>Fecha Carga</dt><dd th:text="${registro.fechaCarga}"></dd></dl><div class="acciones"><a th:href="@{/documento-trabajador/actualizar(id=${registro.idDocumento})}">Actualizar</a><a th:href="@{/documento-trabajador/eliminar(id=${registro.idDocumento})}">Eliminar</a></div></section>
</main></body></html>
