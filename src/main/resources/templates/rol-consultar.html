<!DOCTYPE html>
<!-- Vista Thymeleaf: las rutas y los datos se resuelven en el controlador antes de mostrar el HTML. -->
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Consultar todos · Rol | EmpleApp</title><link rel="stylesheet" th:href="@{/css/empleapp.css}"></head>
<body><header><a th:href="@{/}">EmpleApp</a><span>Gestión de rol</span></header><main>
<!-- Navegación entre las operaciones de la entidad. El enlace EmpleApp vuelve al inicio. -->
<nav aria-label="Operaciones"><a th:href="@{/rol/registrar}">Registrar</a>
<a th:href="@{/rol/actualizar}">Actualizar</a>
<a th:href="@{/rol/consultar}">Consultar todos</a>
<a th:href="@{/rol/consultar-id}">Consultar por ID</a>
<a th:href="@{/rol/eliminar}">Eliminar</a></nav>
<h1>Consultar todos · Rol</h1>
<p class="mensaje" role="status" th:if="${mensaje}" th:text="${mensaje}"></p><p class="error" role="alert" th:if="${error}" th:text="${error}"></p>
<p th:if="${#lists.isEmpty(registros)}">No hay registros. <a th:href="@{/rol/registrar}">Registrar el primero</a></p><div class="tabla" th:unless="${#lists.isEmpty(registros)}"><!-- th:each recorre los registros del modelo; th:text muestra sus valores como texto. -->
<table><thead><tr><th scope="col">Id Rol</th><th scope="col">Nombre Rol</th><th scope="col">Acciones</th></tr></thead><tbody><tr th:each="registro : ${registros}"><td th:text="${registro.idRol}"></td><td th:text="${registro.nombreRol}"></td><td class="acciones"><a th:href="@{/rol/detalle(id=${registro.idRol})}">Detalle</a><a th:href="@{/rol/actualizar(id=${registro.idRol})}">Actualizar</a><a th:href="@{/rol/eliminar(id=${registro.idRol})}">Eliminar</a></td></tr></tbody></table></div>
</main></body></html>
