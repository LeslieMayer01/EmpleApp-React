<!DOCTYPE html>
<!-- Vista Thymeleaf: las rutas y los datos se resuelven en el controlador antes de mostrar el HTML. -->
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Detalle · Servicio | EmpleApp</title><link rel="stylesheet" th:href="@{/css/empleapp.css}"></head>
<body><header><a th:href="@{/}">EmpleApp</a><span>Gestión de servicio</span></header><main>
<!-- Navegación entre las operaciones de la entidad. El enlace EmpleApp vuelve al inicio. -->
<nav aria-label="Operaciones"><a th:href="@{/servicio/registrar}">Registrar</a>
<a th:href="@{/servicio/actualizar}">Actualizar</a>
<a th:href="@{/servicio/consultar}">Consultar todos</a>
<a th:href="@{/servicio/consultar-id}">Consultar por ID</a>
<a th:href="@{/servicio/eliminar}">Eliminar</a></nav>
<h1>Detalle · Servicio</h1>
<p class="mensaje" role="status" th:if="${mensaje}" th:text="${mensaje}"></p><p class="error" role="alert" th:if="${error}" th:text="${error}"></p>
<section th:if="${registro}"><dl><dt>Id Servicio</dt><dd th:text="${registro.idServicio}"></dd>
<dt>Empleador</dt><dd th:text="${registro.empleador == null ? '—' : registro.empleador.etiqueta}"></dd>
<dt>Tipo Servicio</dt><dd th:text="${registro.tipoServicio == null ? '—' : registro.tipoServicio.etiqueta}"></dd>
<dt>Estado</dt><dd th:text="${registro.estado == null ? '—' : registro.estado.etiqueta}"></dd>
<dt>Fecha</dt><dd th:text="${registro.fecha}"></dd>
<dt>Hora Inicio</dt><dd th:text="${registro.horaInicio}"></dd>
<dt>Hora Fin</dt><dd th:text="${registro.horaFin}"></dd>
<dt>Ubicacion</dt><dd th:text="${registro.ubicacion}"></dd>
<dt>Valor Ofertado</dt><dd th:text="${registro.valorOfertado}"></dd></dl><div class="acciones"><a th:href="@{/servicio/actualizar(id=${registro.idServicio})}">Actualizar</a><a th:href="@{/servicio/eliminar(id=${registro.idServicio})}">Eliminar</a></div></section>
</main></body></html>
