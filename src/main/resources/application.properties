spring.application.name=EmpleApp

# Sesión del backend: la cookie no se expone a JavaScript y vence por inactividad.
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Conexion MySQL: base de datos empleapp en el equipo local.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/empleapp?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
# Define DB_PASSWORD con la clave de tu usuario MySQL; por defecto queda vacia.
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Verificar las tablas creadas con DataBase.sql al iniciar la aplicacion.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.open-in-view=false
